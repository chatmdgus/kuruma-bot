name: deploy
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to Oracle server
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          if printf '%s' "$KEY" | grep -q "BEGIN OPENSSH"; then
            printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy
          else
            printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy
          fi
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 ubuntu@193.123.163.59 deploy
